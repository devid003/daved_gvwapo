{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block public %}
<div style="min-height:100vh;display:grid;place-items:center;padding:20px">
  <div class="panel" style="width:100%;max-width:380px;margin:0">
    <div class="panel-body" style="padding:28px">
      <div class="row" style="gap:10px;margin-bottom:18px">
        <svg width="30" height="30" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="#2747C7"/><path d="M7 17.5V8.5h4.2c3 0 4.8 1.7 4.8 4.5s-1.8 4.5-4.8 4.5H7z" fill="none" stroke="#fff" stroke-width="2"/><circle cx="19.5" cy="16.5" r="2" fill="#3CC48D"/></svg>
        <div><h1 style="font-size:20px">Dabid Bots</h1><div class="muted small">Owner panel</div></div>
      </div>
      <form method="post" action="/login">
        <label class="field">Password
          <input type="password" name="password" autofocus required autocomplete="current-password">
        </label>
        <button class="btn primary" style="width:100%;justify-content:center;margin-top:14px">Log in</button>
        {% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
      </form>
    </div>
  </div>
</div>
{% endblock %}
