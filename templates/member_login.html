{% extends "_auth_base.html" %}
{% block title %}Log in - {{ public_name }}{% endblock %}
{% block body %}
<h1>Welcome back</h1>
<p class="sub">Log in to watch the member tutorials.</p>
<form method="post" action="/members/login" autocomplete="on">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="u">Username</label>
  <input id="u" type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Your username" required autofocus>
  <label for="p">Password</label>
  <div class="inp">
    <input id="p" type="password" name="password" autocomplete="current-password" placeholder="Your password" required>
    <button class="show" type="button" aria-pressed="false">Show</button>
  </div>
  <button class="btn">Log in</button>
</form>
<p class="alt">Easiest way: tap <b>Open tutorials</b> on the welcome panel in Discord. No password needed.</p>
{% endblock %}
